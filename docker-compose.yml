services:
    postgres:
        image: postgres:18-alpine
        container_name: chat-postgres
        restart: unless-stopped

        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            TZ: America/Sao_Paulo
            PGTZ: America/Sao_Paulo

        ports:
            - '${POSTGRES_PORT}:5432'

        volumes:
            - postgres_data:/var/lib/postgresql
            - ./postgres/init:/docker-entrypoint-initdb.d:ro

        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

        networks:
            - chat-network

    redis:
        image: redis:8-alpine
        container_name: chat-redis
        restart: unless-stopped

        environment:
            REDIS_DB: ${REDIS_DB}
            REDIS_BULL_DB: ${REDIS_BULL_DB}
            REDIS_USERNAME: ${REDIS_USERNAME}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            TZ: America/Sao_Paulo

        command:
            - /bin/sh
            - -c
            - |
                set -- redis-server --appendonly yes

                if [ -n "$${REDIS_USERNAME}" ] && [ "$${REDIS_USERNAME}" != "default" ]; then
                    set -- "$$@" --user default off

                    if [ -n "$${REDIS_PASSWORD}" ]; then
                        set -- "$$@" --user "$${REDIS_USERNAME}" on ">$${REDIS_PASSWORD}" "~*" "&*" "+@all"
                    else
                        set -- "$$@" --user "$${REDIS_USERNAME}" on nopass "~*" "&*" "+@all"
                    fi
                elif [ -n "$${REDIS_PASSWORD}" ]; then
                    set -- "$$@" --requirepass "$${REDIS_PASSWORD}"
                fi

                exec "$$@"

        ports:
            - '${REDIS_HOST}:${REDIS_PORT}:6379'

        volumes:
            - redis_data:/data

        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ -n "$${REDIS_USERNAME}" ]; then REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli --user "$${REDIS_USERNAME}" ping; elif [ -n "$${REDIS_PASSWORD}" ]; then REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping; else redis-cli ping; fi'
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

        networks:
            - chat-network

    kafka:
        image: apache/kafka:4.3.1
        hostname: kafka
        container_name: chat-kafka
        restart: unless-stopped

        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_BROKERS}
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
            KAFKA_NUM_PARTITIONS: 3
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
            KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
            CLUSTER_ID: ${KAFKA_CLUSTER_ID}
            TZ: America/Sao_Paulo

        ports:
            - '${KAFKA_HOST}:${KAFKA_PORT}:9092'

        volumes:
            - kafka_data:/tmp/kraft-combined-logs

        healthcheck:
            test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 20s

        networks:
            - chat-network

volumes:
    postgres_data:
        name: chat-postgres-data
    redis_data:
        name: chat-redis-data
    kafka_data:
        name: chat-kafka-data

networks:
    chat-network:
        name: chat-network
